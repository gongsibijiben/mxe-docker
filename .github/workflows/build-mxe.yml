name: Build MXE Qt6 Docker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mxe.yml'
      - 'build-mxe.sh'
      - 'Dockerfile.mxe'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute cache key
        id: vars
        run: echo "cache_key=mxe-qt6-${{ hashFiles('build-mxe.sh', 'Dockerfile.mxe') }}" >> $GITHUB_OUTPUT

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: Restore MXE cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/mxe
          key: ${{ steps.vars.outputs.cache_key }}
          restore-keys: |
            mxe-qt6-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint bash bison bzip2 flex g++ g++-multilib \
            gettext git gperf intltool libc6-dev-i386 libgdk-pixbuf2.0-dev \
            libltdl-dev libssl-dev libtool libtool-bin make openssl p7zip-full \
            patch pkg-config python3 python3-pip python-is-python3 unzip wget \
            xz-utils cmake ninja-build lzip fakeroot libjson-perl
          sudo pip3 install --break-system-packages mako

      - name: Clone MXE
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          [ -d /opt/mxe ] || git clone --depth 1 https://github.com/mxe/mxe.git /opt/mxe
          sudo chown -R $(whoami):$(whoami) /opt/mxe

      - name: Build MXE + Qt6
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash build-mxe.sh

      - name: Upload MXE logs
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mxe-logs
          path: /opt/mxe/log/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save MXE cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/mxe
          key: ${{ steps.vars.outputs.cache_key }}

      - name: Prepare Docker context
        run: sudo cp -r /opt/mxe/usr ./mxe-usr

      - name: Lowercase image name
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.mxe
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE }}:latest
            ghcr.io/${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
